<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pareja del Año - Sebastián Yatra & Myke Towers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00c9ff, #7b4397, #dc2430);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow-x: hidden;
      padding: 30px 20px;
      padding-bottom: 180px;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }
    
    h1 {
      color: white;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      margin-bottom: 5px;
      font-size: 2.2em;
    }
    
    .subtitle {
      color: rgba(255,255,255,0.85);
      margin-bottom: 25px;
      font-size: 1em;
    }
    
    .mensaje-personalizado {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      padding: 18px 25px;
      margin-bottom: 30px;
      color: #fff;
      font-size: 1.1em;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }
    
    .audio-container {
      background: rgba(0,0,0,0.25);
      padding: 25px;
      border-radius: 50px;
      margin-bottom: 30px;
      display: inline-block;
      backdrop-filter: blur(10px);
    }
    
    audio {
      width: 100%;
      max-width: 400px;
      height: 45px;
      margin-bottom: 12px;
    }
    
    .btn-play {
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      color: #333;
      border: none;
      border-radius: 30px;
      padding: 15px 40px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(252, 182, 159, 0.4);
      transition: all 0.3s ease;
    }
    
    .btn-play:hover {
      transform: translateY(-2px);
    }
    
    .btn-flowers {
      background: linear-gradient(135deg, #ffe8c8, #ffd3b6);
      color: #5a3e2b;
      border: none;
      border-radius: 50px;
      padding: 14px 35px;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 183, 137, 0.3);
      margin-bottom: 60px;
    }
    
    .btn-flowers:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 183, 137, 0.4);
    }
    
    .lyrics-wrapper {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      padding: 20px;
      text-align: center;
      z-index: 100;
    }
    
    .lyrics-container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .lyrics-line.active {
      font-family: 'Georgia', 'Palatino', serif;
      font-size: 1.8em;
      font-weight: 600;
      color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.35);
      letter-spacing: 0.5px;
      line-height: 1.5;
      transition: all 0.5s ease;
      opacity: 1;
    }
    
    .lyrics-line.next {
      font-family: 'Georgia', 'Palatino', serif;
      font-size: 1.05em;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 8px;
      font-style: italic;
      transition: all 0.5s ease;
    }
    
    .flower {
      position: fixed;
      font-size: 30px;
      pointer-events: none;
      z-index: 50;
      animation: fallFlower linear forwards;
    }
    
    @keyframes fallFlower {
      0% {
        opacity: 1;
        transform: translate(0, -50px) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0.7;
        transform: translate(var(--drift-x), calc(100vh + 60px)) rotate(var(--rotate-end)) scale(0.9);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💐 Pareja del Año 💐</h1>
    <p class="subtitle">Sebastián Yatra & Myke Towers</p>
    
    <div class="mensaje-personalizado">
      ✨ Escribe aquí tu mensaje especial ✨
    </div>
    
    <div class="audio-container">
      <audio id="audioPlayer" controls preload="auto">
        <source src="pareja-del-ano.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
      
      
      <br>
      <button class="btn-play" id="playAudioBtn" style="display: none;">▶️ Toca aquí para empezar 🎵</button>
    </div>
    
    <br>
    <button class="btn-flowers" onclick="generarRafagaFlores()">🌸 ¡Generar Flores! 🌺</button>
  </div>

  <div class="lyrics-wrapper">
    <div class="lyrics-container">
      <div class="lyrics-line active" id="currentLine">Cargando... ✨</div>
      <div class="lyrics-line next" id="nextLine"></div>
    </div>
  </div>

  { tiempo: 126.00, texto: "Sin condición" },
  { tiempo: 129.00, texto: "Me enamoré, precisamente, de una chica que no es mía" },
  { tiempo: 134.00, texto: "Y mis amigos lo sabían" },
  { tiempo: 137.00, texto: "Y a mí todo el mundo me decía qué pasaría, me dejarías" },

  { tiempo: 219.00, texto: "Yo tenía otra melodía" },

  { tiempo: 238.00, texto: "Tú aprendiste a no ser mía (no)" },
  { tiempo: 242.00, texto: "Solo queda ser sincero" },
  { tiempo: 246.00, texto: "Yo te quiero todavía" },
  { tiempo: 250.00, texto: "🎵 Fin 🎵" }
];

const emojisFlores = ['🌸', '🌺', '🌻', '🌷', '🌹', '💐', '🌼', '🌺', '🌸'];

let lineaActual = -1;
let reproductor;

document.addEventListener('DOMContentLoaded', function() {
  reproductor = document.getElementById('audioPlayer');
  const botonReproducir = document.getElementById('playAudioBtn');
  
  reproductor.addEventListener('timeupdate', actualizarLetra);
  setInterval(generarFlorSola, 3500);
  
  // Los navegadores web NO permiten reproducción automática con sonido
  // Por eso mostramos el botón para que el usuario haga clic
  botonReproducir.style.display = 'inline-block';
  
  botonReproducir.addEventListener('click', function() {
    reproductor.play().then(function() {
      botonReproducir.style.display = 'none';
      document.getElementById('currentLine').textContent = "¡Disfruta! ✨";
    }).catch(function() {
      alert("❌ No se pudo cargar el audio.\n\nAsegúrate de subir el archivo pareja-del-ano.mp3 junto con el index.html");
    });
  });
});

function actualizarLetra() {
  const tiempoActual = reproductor.currentTime;
  let indiceEncontrado = -1;
  
  for (let i = 0; i < letra.length; i++) {
    if (tiempoActual >= letra[i].tiempo) {
      indiceEncontrado = i;
    }
  }
  
  if (indiceEncontrado !== lineaActual && indiceEncontrado >= 0) {
    lineaActual = indiceEncontrado;
    document.getElementById('currentLine').textContent = letra[indiceEncontrado].texto;
    
    if (indiceEncontrado + 1 < letra.length) {
      document.getElementById('nextLine').textContent = letra[indiceEncontrado + 1].texto;
    } else {
      document.getElementById('nextLine').textContent = '';
    }
  }
}

function crearFlor() {
  const flor = document.createElement('div');
  flor.className = 'flower';
  flor.textContent = emojisFlores[Math.floor(Math.random() * emojisFlores.length)];
  
  const posicionX = Math.random() * window.innerWidth;
  flor.style.left = posicionX + 'px';
  flor.style.top = '-50px';
  
  const desplazamientoLateral = (Math.random() - 0.5) * 180;
  const rotacionFinal = (Math.random() - 0.5) * 720;
  const duracionCaida = 4 + Math.random() * 5;
  
  flor.style.setProperty('--drift-x', desplazamientoLateral + 'px');
  flor.style.setProperty('--rotate-end', rotacionFinal + 'deg');
  flor.style.animationDuration = duracionCaida + 's';
  
  const tamano = 20 + Math.random() * 20;
  flor.style.fontSize = tamano + 'px';
  
  document.body.appendChild(flor);
  setTimeout(() => flor.remove(), duracionCaida * 1000);
}

function generarFlorSola() {
  crearFlor();
}

function generarRafagaFlores() {
  const cantidad = 12 + Math.floor(Math.random() * 12);
  for (let i = 0; i < cantidad; i++) {
    setTimeout(crearFlor, i * 45);
  }
}
  </script>
  
</body>
</html>
