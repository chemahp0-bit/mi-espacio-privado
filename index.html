<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Espacio Privado</title>
    <style>
        /* --- 1. FONDO CON DEGRADADO ANIMADO --- */
        /* Puedes cambiar los 4 códigos de color (#...) por los que tú quieras */
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: moverFondo 12s ease infinite;
        }

        @keyframes moverFondo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. TARJETA CENTRAL CON EFECTO CRISTAL --- */
        .contenedor {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 750px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* --- 3. ANIMACIONES PARA LOS TEXTOS --- */
        @keyframes entrarDesdeAbajo {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes brilloTitulo {
            0%, 100% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); }
            50% { text-shadow: 0 0 25px rgba(255, 255, 255, 0.9); }
        }

        .titulo-animado {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ffeb3b; /* Color del título */
            animation: entrarDesdeAbajo 1s ease-out, brilloTitulo 3s infinite;
        }

        .parrafo-animado {
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 25px;
            color: #f1f1f1; /* Color del texto normal */
            animation: entrarDesdeAbajo 1.5s ease-out;
        }

        /* --- 4. ESTILO DEL VÍDEO --- */
        .caja-video {
            animation: entrarDesdeAbajo 2s ease-out;
            margin-top: 20px;
        }

        video {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            outline: none;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <!-- TÍTULO PRINCIPAL -->
        <h1 class="titulo-animado">Bienvenido a nuestro espacio</h1>
        
        <!-- TEXTOS PERSONALIZABLES -->
        <p class="parrafo-animado">
            Aquí puedes escribir todo el texto que quieras. Puedes añadir más párrafos copiando y pegando esta misma etiqueta.
        </p>

        <p class="parrafo-animado" style="color: #80ffdb;">
            Este segundo párrafo tiene un color diferente gracias al atributo "style" que lleva dentro.
        </p>

        <!-- REPRODUCTOR DE VÍDEO -->
        <div class="caja-video">
            <!-- Asegúrate de que el archivo de vídeo esté en la misma carpeta y tenga este mismo nombre -->
            <video controls>
                <source src="mi-video.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de vídeos.
            </video>
        </div>
    </div>

</body>
</html>
