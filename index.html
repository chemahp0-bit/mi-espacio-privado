<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pareja del Año - Sebastián Yatra & Myke Towers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00c9ff, #7b4397, #dc2430);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow-x: hidden;
      padding: 30px 20px;
      padding-bottom: 100px;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }
    
    h1 {
      color: white;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      margin-bottom: 5px;
      font-size: 2.2em;
    }
    
    .subtitle {
      color: rgba(255,255,255,0.85);
      margin-bottom: 30px;
      font-size: 1em;
    }
    
    .mensaje-personalizado {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      padding: 25px 35px;
      margin-bottom: 30px;
      color: #fff;
      font-size: 1.3em;
      line-height: 1.6;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      font-style: italic; /* ✅ LETRAS EN CURSIVA */
    }
    
    .audio-container {
      background: rgba(0,0,0,0.25);
      padding: 25px;
      border-radius: 50px;
      margin-bottom: 30px;
      display: inline-block;
      backdrop-filter: blur(10px);
    }
    
    audio {
      width: 100%;
      max-width: 400px;
      height: 45px;
    }
    
    .btn-flowers {
      background: linear-gradient(135deg, #ffe8c8, #ffd3b6);
      color: #5a3e2b;
      border: none;
      border-radius: 50px;
      padding: 14px 35px;
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 183, 137, 0.3);
    }
    
    .btn-flowers:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 183, 137, 0.4);
    }
    
    .flower {
      position: fixed;
      font-size: 30px;
      pointer-events: none;
      z-index: 50;
      animation: fallFlower linear forwards;
    }
    
    @keyframes fallFlower {
      0% {
        opacity: 1;
        transform: translate(0, -50px) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0.7;
        transform: translate(var(--drift-x), calc(100vh + 60px)) rotate(var(--rotate-end)) scale(0.9);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💐 Pareja del Año 💐</h1>
    <p class="subtitle">Sebastián Yatra & Myke Towers</p>
    
    <!-- ======================================================
     ✅ AQUÍ ES DONDE ESCRIBES TU MENSAJE 
     Cambia el texto que está entre las dos líneas de abajo
     ====================================================== -->
    <div class="mensaje-personalizado">
      Escribe aquí tu mensaje especial con letras en cursiva ✨
    </div>
    <!-- ======================================================
     FIN DEL MENSAJE - No toques nada más de alrededor
     ====================================================== -->
    
    <div class="audio-container">
      <audio controls preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
      
    </div>
    
    <br><br>
    <button class="btn-flowers" onclick="generarRafagaFlores()">🌸 ¡Generar Flores! 🌺</button>
  </div>

  <script>
    const emojisFlores = ['🌸', '🌺', '🌻', '🌷', '🌹', '💐', '🌼', '🌺', '🌸'];
    
    function crearFlor() {
      const flor = document.createElement('div');
      flor.className = 'flower';
      flor.textContent = emojisFlores[Math.floor(Math.random() * emojisFlores.length)];
      
      const posicionX = Math.random() * window.innerWidth;
      flor.style.left = posicionX + 'px';
      flor.style.top = '-50px';
      
      const desplazamientoLateral = (Math.random() - 0.5) * 180;
      const rotacionFinal = (Math.random() - 0.5) * 720;
      const duracionCaida = 4 + Math.random() * 5;
      
      flor.style.setProperty('--drift-x', desplazamientoLateral + 'px');
      flor.style.setProperty('--rotate-end', rotacionFinal + 'deg');
      flor.style.animationDuration = duracionCaida + 's';
      
      const tamano = 20 + Math.random() * 20;
      flor.style.fontSize = tamano + 'px';
      
      document.body.appendChild(flor);
      setTimeout(() => flor.remove(), duracionCaida * 1000);
    }
    
    function generarFlorSola() {
      crearFlor();
    }
    
    function generarRafagaFlores() {
      const cantidad = 12 + Math.floor(Math.random() * 12);
      for (let i = 0; i < cantidad; i++) {
        setTimeout(crearFlor, i * 45);
      }
    }
    
    // Flores cayendo solas
    setInterval(generarFlorSola, 3500);
  </script>
  
</body>
</html>
