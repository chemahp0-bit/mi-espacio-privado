<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pareja del año</title>
<style>
body {
  margin: 0;
  padding: 80px 20px;
  min-height: 100vh;
  background: linear-gradient(135deg, #4facfe, #7b4397, #dc2430);
  background-size: 400% 400%;
  animation: fondo 15s ease infinite;
  font-family: Arial, sans-serif;
  text-align: center;
}

@keyframes fondo {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

h1 {
  color: #ffcba4;
  font-size: 32px;
  margin-bottom: 40px;
}

.texto {
  padding: 30px;
  color: #fff8f0;
  font-size: 22px;
  font-style: italic;
  max-width: 500px;
  margin: 0 auto 50px;
}

button {
  background: #ffe8c8;
  border: none;
  border-radius: 25px;
  padding: 12px 30px;
  font-size: 18px;
  cursor: pointer;
}

.flor {
  position: fixed;
  top: 0;
  font-size: 30px;
  pointer-events: none;
  animation: caer 5s linear forwards;
}

@keyframes caer {
  0% { transform: translateY(-50px); opacity: 1; }
  100% { transform: translateY(100vh); opacity: 0.7; }
}
</style>
</head>
<body>

<h1>No funciona</h1>

<div class="texto">
  ¡Ahora sí funciona! ❤️
</div>

<button onclick="lanzarFlores()">🌸 ¡Generar Flores! 🌺</button>

<script>
const tipos = ['🌹','🌷','🪻','🌺','🏵️','💮','🌸','🌼','🌻','💐'];
let musicaActiva = false;

// Cargar audio de forma segura — NO bloquea la página
function iniciarAudio() {
  if (musicaActiva) return;
  const audio = new Audio('audio.mp3');
  audio.loop = true;
  audio.volume = 0.5;
  audio.play().then(() => {
    musicaActiva = true;
    console.log('🎵 Música activada');
  }).catch(() => {
    console.log('ℹ️ Coloca audio.mp3 en la carpeta para escuchar música');
  });
}

function crearFlor() {
  const f = document.createElement('div');
  f.className = 'flor';
  f.textContent = tipos[Math.floor(Math.random() * tipos.length)];
  f.style.left = Math.random() * 100 + '%';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 5000);
}

function lanzarFlores() {
  for(let i=0; i<20; i++) setTimeout(crearFlor, i*50);
}

setInterval(function() {
  crearFlor();
  crearFlor();
  crearFlor();
  crearFlor();
  crearFlor();
  crearFlor();
  crearFlor();
  crearFlor();
  crearFlor();
  crearFlor();
}, 600);


// Activar música al primer clic
document.addEventListener('click', iniciarAudio);
</script>

</body>
</html>
