<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pareja del Año</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00c9ff, #7b4397, #dc2430);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .container {
      text-align: center;
      color: white;
    }
    
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }
    
    .subtitle {
      font-size: 1.2em;
      opacity: 0.9;
      margin-bottom: 40px;
    }
    
    .mensaje {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      padding: 25px 35px;
      font-size: 1.2em;
      max-width: 500px;
      backdrop-filter: blur(10px);
      margin-bottom: 40px;
    }
    
    .aviso-audio {
      background: rgba(0,0,0,0.2);
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 0.95em;
      max-width: 450px;
    }
    
    audio {
      opacity: 0.7;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <audio id="musica" autoplay loop preload="auto">
    <source src="audio.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  

  <div class="container">
    <h1>💐 Pareja del Año 💐</h1>
    <p class="subtitle">Sebastián Yatra & Myke Towers</p>
    
    <div class="mensaje">
      ✨ Escribe aquí tu mensaje especial ✨
    </div>
    
    <div class="aviso-audio">
      🎵 Si no escuchas música, activa el sonido de tu navegador o haz clic en el reproductor de abajo.
    </div>
    
    <audio controls>
      <source src="audio.mp3" type="audio/mpeg">
    
  </div>

  <script>
    const audio = document.getElementById('musica');
    
    // Intento de reproducción automática
    document.addEventListener('DOMContentLoaded', function() {
      audio.volume = 0.7;
      audio.play().catch(function() {
        console.log("El navegador bloqueó el audio automático — usa el reproductor visible");
      });
    });
    
    // También reproducir al primer clic del usuario en la página
    document.addEventListener('click', function iniciarAudio() {
      audio.play().catch(function() {});
      document.removeEventListener('click', iniciarAudio);
    });
  </script>
  
</body>
</html>
