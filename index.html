<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pareja del Año</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00c9ff, #7b4397, #dc2430);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow-x: hidden;
      padding: 40px 20px;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .contenido {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 90%;
      max-width: 600px;
    }
    
    h1 {
      color: white;
      font-size: 2.5em;
      margin-bottom: 50px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.15);
    }
    
    .mensaje {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 40px 30px;
      color: #fff;
      font-size: 1.5em;
      line-height: 1.8;
      font-style: italic;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      margin-bottom: 60px;
    }
    
    .boton-flores {
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      color: #6b4226;
      border: none;
      border-radius: 50px;
      padding: 18px 50px;
      font-size: 1.15em;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(252, 182, 159, 0.4);
      transition: all 0.3s ease;
    }
    
    .boton-flores:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 10px 30px rgba(252, 182, 159, 0.5);
    }
    
    .boton-flores:active {
      transform: translateY(-1px) scale(0.98);
    }
    
    .aviso {
      color: rgba(255,255,255,0.5);
      font-size: 0.85em;
      margin-top: 40px;
    }
    
    .flor {
      position: fixed;
      font-size: 30px;
      pointer-events: none;
      z-index: 100;
      animation: caer linear forwards;
    }
    
    @keyframes caer {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0.7; }
    }
  </style>
</head>
<body>

  <!-- Audio oculto -->
  <audio id="musica" loop preload="auto" style="display:none;">
    <source src="audio.mp3" type="audio/mpeg">
  

  <!-- Contenido centrado -->
  <div class="contenido">
    <h1>💐 Pareja del Año 💐</h1>
    
    <!-- ========== TU MENSAJE AQUÍ ========== -->
    <div class="mensaje">
      Escribe aquí tu mensaje especial con letras en cursiva ✨
    </div>
    <!-- ======================================= -->
    
    <button class="boton-flores" onclick="lanzarFlores()">🌸 ¡Generar Flores! 🌺</button>
    
    <p class="aviso">💡 Haz clic una vez en la página para escuchar la música 🎵</p>
  </div>

  <script>
    const tiposFlor = ['🌸', '🌺', '🌻', '🌷', '🌹', '💐', '🌼', '🌷', '🌹', '🌸'];
    const audio = document.getElementById('musica');
    let musicaLista = false;
    
    // Crear una flor
    function crearFlor() {
      const flor = document.createElement('div');
      flor.className = 'flor';
      flor.textContent = tiposFlor[Math.floor(Math.random() * tiposFlor.length)];
      
      const posicionX = Math.random() * window.innerWidth;
      flor.style.left = posicionX + 'px';
      flor.style.top = '0px';
      
      const tamano = 18 + Math.random() * 22;
      flor.style.fontSize = tamano + 'px';
      
      const duracion = 4 + Math.random() * 3;
      flor.style.animationDuration = duracion + 's';
      
      document.body.appendChild(flor);
      setTimeout(() => flor.remove(), duracion * 1000);
    }
    
    // Ráfaga al pulsar el botón
    function lanzarFlores() {
      for (let i = 0; i < 30; i++) {
        setTimeout(crearFlor, i * 35);
      }
    }
    
    // Flores cayendo solas
    setInterval(crearFlor, 700);
    
    // Iniciar música al primer clic
    document.addEventListener('click', function iniciarAudio() {
      if (musicaLista) return;
      
      audio.volume = 0.6;
      audio.play().then(function() {
        musicaLista = true;
        document.querySelector('.aviso').style.opacity = '0';
      }).catch(function() {
        console.log('Audio.mp3 no encontrado');
      });
    });
  </script>
  
</body>
</html>
